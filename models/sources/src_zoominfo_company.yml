
version: 2
sources:
  - name: bronze
    database: GDP_CLIENT_DB
    schema: BRONZE
    tables:
      - name: BRONZE_ZOOMINFO_COMPANY
        description: ZoomInfo raw company feed (bronze layer)
        loaded_at_field: LOAD_TIMESTAMP
        columns:
          - name: BRONZE_KEY
          - name: ZOOMINFO_ID
            description: ZoomInfo company identifier
            tests: [not_null, unique]
          - name: COMPANY_NAME
          - name: TICKER
          - name: WEBSITE
          - name: EMPLOYEE_COUNT
          - name: REVENUE
          - name: INDUSTRY
          - name: FOUNDED_YEAR
          - name: HQ_ADDRESS
          - name: HQ_CITY
          - name: HQ_STATE
          - name: HQ_COUNTRY
          - name: LINKEDIN_URL
          - name: TECHNOLOGIES
          - name: RAW_JSON
          - name: LOAD_TIMESTAMP
          - name: MD5_HASH
